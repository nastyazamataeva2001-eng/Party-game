<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Lost &amp; Found: The Detective's Cleanup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#160f22;
    --card:#fdf6ec;
    --card-edge:#f0e2c8;
    --ink:#2b2036;
    --pink:#ff4f9a;
    --teal:#28d6c4;
    --gold:#ffc93c;
    --violet:#8a5cff;
    --red:#ef4b5f;
    --green:#22b573;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(255,79,154,0.18), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(40,214,196,0.16), transparent 45%),
      radial-gradient(circle at 50% 95%, rgba(138,92,255,0.18), transparent 50%),
      var(--bg);
    color:var(--card);
    font-family:'Quicksand', sans-serif;
    display:flex;
    justify-content:center;
    padding:30px 14px 60px;
  }
  .wrap{width:100%;max-width:640px;}

  .masthead{text-align:center;margin-bottom:20px;}
  .badge{font-family:'Fredoka', sans-serif;font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
  h1{font-family:'Fredoka', sans-serif;font-size:clamp(24px,6.5vw,34px);margin:8px 0 6px;color:#fff;line-height:1.15;}
  h1 span{color:var(--pink);}
  .subtitle{font-size:14px;color:#c8bce6;}

  .tracker{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:20px 0 26px;}
  .tag{font-family:'Fredoka', sans-serif;font-size:10px;padding:6px 10px;border-radius:20px;color:#a293c9;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);letter-spacing:0.5px;transition:all .35s ease;}
  .tag.done{color:#160f22;background:var(--teal);border-color:var(--teal);}
  .tag.current{color:#fff;border-color:var(--pink);box-shadow:0 0 0 3px rgba(255,79,154,0.2);}

  .card{background:var(--card);color:var(--ink);border-radius:18px;padding:26px 24px 22px;position:relative;box-shadow:0 20px 44px rgba(0,0,0,0.45);border:2px solid var(--card-edge);}
  .item-tag{display:inline-block;font-family:'Fredoka', sans-serif;font-size:11px;background:var(--violet);color:#fff;padding:4px 12px;border-radius:20px;letter-spacing:1px;margin-bottom:4px;}
  .phase-tag{display:inline-block;font-family:'Fredoka', sans-serif;font-size:10px;background:transparent;color:#a691c9;padding:4px 0 0;letter-spacing:2px;margin-bottom:10px;}
  .item-icon{font-size:40px;margin:4px 0 8px;display:block;}
  .item-desc{font-size:14.5px;line-height:1.55;margin-bottom:6px;color:#4b3f5e;}
  .clue-box{
    font-size:13.5px;
    line-height:1.5;
    background:#f4ecdd;
    border-left:4px solid var(--gold);
    border-radius:0 12px 12px 0;
    padding:10px 14px;
    margin:12px 0 16px;
    color:#4b3f5e;
  }
  .clue-box b{color:var(--ink);}

  .suspects{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .suspect-card{
    text-align:left;
    background:#fff;
    border:2px solid #e4d6bd;
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    font-family:'Quicksand', sans-serif;
    transition:transform .12s ease, border-color .15s ease;
  }
  .suspect-card:hover:not(:disabled){transform:translateY(-2px);border-color:var(--violet);}
  .suspect-card:disabled{cursor:default;}
  .suspect-name{
    font-family:'Fredoka', sans-serif;
    font-size:12.5px;
    letter-spacing:1px;
    color:var(--violet);
    margin-bottom:3px;
    display:block;
  }
  .suspect-line{font-size:14px;line-height:1.5;color:var(--ink);}
  .suspect-card.right{background:#e8f8ef;border-color:var(--green);}
  .suspect-card.wrong{background:#fdecee;border-color:var(--red);opacity:0.75;}

  .dialogue{
    font-family:'Fredoka', sans-serif;
    font-weight:500;
    font-size:15.5px;
    line-height:1.75;
    background:#f4ecdd;
    border-left:4px solid var(--pink);
    border-radius:0 12px 12px 0;
    padding:13px 15px;
    margin-bottom:18px;
  }
  .speaker{display:block;font-size:11px;letter-spacing:2px;color:var(--pink);margin-bottom:4px;font-family:'Quicksand',sans-serif;font-weight:700;}
  .blank{display:inline-block;min-width:70px;border-bottom:3px dotted var(--violet);text-align:center;font-weight:700;color:var(--red);}

  .options{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px;}
  .opt-btn{font-family:'Fredoka', sans-serif;font-size:14px;background:#fff;border:2px solid var(--ink);color:var(--ink);padding:10px 20px;border-radius:24px;cursor:pointer;transition:transform .12s ease, background .15s ease, color .15s ease;}
  .opt-btn:hover:not(:disabled){background:var(--violet);border-color:var(--violet);color:#fff;transform:translateY(-2px);}
  .opt-btn:disabled{cursor:default;opacity:0.55;}
  .opt-btn.right{background:var(--green);border-color:var(--green);color:#fff;}
  .opt-btn.wrong{background:var(--red);border-color:var(--red);color:#fff;}

  .feedback{margin-top:16px;padding-top:14px;border-top:2px dashed #e4d6bd;}
  .stamp{font-family:'Fredoka', sans-serif;display:inline-block;font-size:17px;letter-spacing:1px;padding:6px 16px;border-radius:24px;margin-bottom:10px;animation:stampIn .35s ease;}
  .stamp.right{color:#fff;background:var(--green);}
  .stamp.wrong{color:#fff;background:var(--red);}
  @keyframes stampIn{0%{transform:scale(0.5);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .explain{font-size:13.5px;line-height:1.6;color:#4b3f5e;}
  .next-btn{margin-top:16px;font-family:'Fredoka', sans-serif;background:var(--ink);color:#fff;border:none;padding:11px 22px;border-radius:24px;cursor:pointer;font-size:13px;letter-spacing:1px;}
  .next-btn:hover{background:#000;}

  .final .item-icon{font-size:50px;}
  .report-line{font-family:'Fredoka', sans-serif;font-size:15px;line-height:2;}
  .report-line b{color:var(--pink);}
  .rank{text-align:center;margin:18px 0 6px;font-family:'Fredoka', sans-serif;font-size:22px;color:var(--violet);letter-spacing:1px;}
  .score-line{text-align:center;font-size:13px;color:#7d6f5a;margin-bottom:16px;}
  .restart-btn{display:block;margin:20px auto 0;font-family:'Fredoka', sans-serif;background:var(--gold);color:#2b2036;border:none;padding:12px 26px;border-radius:24px;cursor:pointer;font-size:13px;letter-spacing:1px;}
  footer.hint{text-align:center;font-size:11px;color:#8f81b8;margin-top:18px;letter-spacing:0.5px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="badge">The morning after</div>
    <h1>PARTY <span>LOST &amp; FOUND</span></h1>
    <div class="subtitle">Read the clues, work out who really owns each item, then report it correctly.</div>
  </div>

  <div class="tracker" id="tracker"></div>
  <div class="card" id="card"></div>
  <footer class="hint" id="hint"></footer>
</div>

<script>
// Each round has two phases:
// 1) "detective" — read the clue + three suspect statements, pick the one that actually fits the clue
// 2) "grammar"   — now that the owner is known, choose the correct possessive pronoun

const rounds = [
  {
    pronoun: "his",
    icon: "👛",
    tagLabel: "ITEM 1 — WALLET",
    desc: "A worn brown wallet turns up under the couch cushions.",
    clue: "The wallet has a small <b>basketball keychain</b>, and there's a food-truck receipt inside timestamped <b>11:47pm</b>.",
    suspects: [
      { name: "JAKE", line: "\"I was out by the garage grabbing pizza around midnight — I'm always at that truck.\"", correct: true,
        reason: "Jake's story lines up exactly with the receipt: same spot, same time." },
      { name: "MARIA", line: "\"I was on the dance floor the whole night, never went outside.\"", correct: false,
        reason: "Maria says she never went outside — but the receipt is from a truck parked outside. Doesn't fit." },
      { name: "THE TWINS", line: "\"We ran the music booth all night, we never left it.\"", correct: false,
        reason: "The twins say they never left the booth, so they couldn't have bought food outside." }
    ],
    line: "\"Detective, this must be ____ — he was standing right by the truck when that receipt was stamped.\"",
    speaker: "YOU (the host)",
    options: ["his", "hers", "mine"],
    explain: "The wallet belongs to Jake — a man who isn't part of this conversation. For a male third-party owner, standing alone, we use his."
  },
  {
    pronoun: "hers",
    icon: "👜",
    tagLabel: "ITEM 2 — HANDBAG",
    desc: "A little sparkly handbag was left hanging on a chair.",
    clue: "Inside is a lipstick in a specific shade called <b>\"Sunset Coral.\"</b>",
    suspects: [
      { name: "SOFIA", line: "\"That's the only lipstick shade I own — I never leave home without it.\"", correct: true,
        reason: "Sofia directly confirms Sunset Coral is her go-to shade." },
      { name: "JAKE", line: "\"Lipstick? Definitely not mine, I don't wear makeup.\"", correct: false,
        reason: "Jake rules himself out completely — no lipstick at all." },
      { name: "THE TWINS", line: "\"We don't carry handbags, we keep our hands free for the turntables.\"", correct: false,
        reason: "The twins don't carry handbags in the first place, so it can't be theirs." }
    ],
    line: "\"This handbag must be ____ — that's her signature lipstick shade.\"",
    speaker: "YOU (the host)",
    options: ["hers", "yours", "theirs"],
    explain: "The handbag belongs to Sofia — a woman who isn't part of this conversation. For a female third-party owner, standing alone, we use hers (no apostrophe)."
  },
  {
    pronoun: "mine",
    icon: "🔌",
    tagLabel: "ITEM 3 — PHONE CHARGER",
    desc: "A tangled phone charger is still plugged into the kitchen outlet.",
    clue: "The cable is bright yellow with a tiny <b>paw-print sticker</b> on it.",
    suspects: [
      { name: "ZOE", line: "\"Oh! That yellow cable with the paw print — I put that sticker on because I have a cat.\"", correct: true,
        reason: "Zoe recognizes the exact detail — the paw print and the reason behind it." },
      { name: "MARIA", line: "\"Not mine, I don't even own a charger with stickers on it.\"", correct: false,
        reason: "Maria says she has no stickers on her charger at all." },
      { name: "THE TWINS", line: "\"We share one plain white charger — definitely not that one.\"", correct: false,
        reason: "The twins' charger is plain white, not yellow with a sticker." }
    ],
    line: "\"Yeah, that's ____ — I told you, cat person.\"",
    speaker: "ZOE (to the detective)",
    options: ["mine", "his", "ours"],
    explain: "Zoe is talking about her own charger, in the first person. The possessive pronoun for 'I', standing alone, is mine."
  },
  {
    pronoun: "yours",
    icon: "🧣",
    tagLabel: "ITEM 4 — SCARF",
    desc: "A soft striped scarf was left draped over the coat rack by the door.",
    clue: "Three party photos were taken tonight. Only one shows anyone wearing a striped scarf.",
    suspects: [
      { name: "PHOTO — 8:02pm", line: "Jake in a plain black jacket, no scarf in sight.", correct: false,
        reason: "No scarf appears in this photo at all." },
      { name: "PHOTO — 9:14pm", line: "You (the host), laughing by the door in a striped scarf.", correct: true,
        reason: "This is the only photo where a striped scarf actually appears — and it's you wearing it." },
      { name: "PHOTO — 10:30pm", line: "The twins DJing, no scarf visible.", correct: false,
        reason: "No scarf shows up here either." }
    ],
    line: "\"Here, this is ____ — I've even got the photo to prove it.\"",
    speaker: "MAYA (to you)",
    options: ["yours", "hers", "theirs"],
    explain: "Maya is speaking directly to you (the host) about something that belongs to you. When talking about the listener's item, English uses yours."
  },
  {
    pronoun: "theirs",
    icon: "🪮",
    tagLabel: "ITEM 5 — HAIRBRUSH",
    desc: "A single hairbrush was left by the bathroom mirror.",
    clue: "The handle is <b>two-tone</b> — half pink, half blue.",
    suspects: [
      { name: "JAKE", line: "\"Not mine — I don't even own a hairbrush, I shave my head.\"", correct: false,
        reason: "Jake doesn't use a hairbrush at all." },
      { name: "SOFIA", line: "\"Nope, my hairbrush is neon green, not pink and blue.\"", correct: false,
        reason: "Sofia's brush is a completely different color." },
      { name: "THE TWINS", line: "\"Oh, that's from our bathroom — we each picked one color for our shared brush.\"", correct: true,
        reason: "The two-tone color matches perfectly: one color per twin, on one shared brush." }
    ],
    line: "\"This must be ____ — only they'd have a two-tone brush like that.\"",
    speaker: "YOU (the host)",
    options: ["theirs", "hers", "ours"],
    explain: "The hairbrush belongs to the twins — two people who aren't part of this conversation. For a third-party plural owner, standing alone, we use theirs."
  },
  {
    pronoun: "ours",
    icon: "📓",
    tagLabel: "ITEM 6 — NOTEBOOK",
    desc: "A notebook full of playlist ideas is sitting on the kitchen counter.",
    clue: "The cover reads <b>\"Party Playlist\"</b> in two different handwriting styles — one loopy, one blocky.",
    suspects: [
      { name: "JAKE", line: "\"That's not my handwriting at all — mine's way messier than that.\"", correct: false,
        reason: "Jake's handwriting doesn't match either style shown." },
      { name: "SOFIA", line: "\"Not familiar — I never write in cursive.\"", correct: false,
        reason: "Sofia doesn't recognize either handwriting style." },
      { name: "LEO", line: "\"Actually... the loopy handwriting is mine, and the blocky one is yours — we wrote this together.\"", correct: true,
        reason: "Leo identifies both handwriting styles — his own and yours — confirming it was written together." }
    ],
    line: "\"Don't lose that notebook — it's ____. We spent all week planning this together.\"",
    speaker: "LEO (your co-host)",
    options: ["ours", "mine", "theirs"],
    explain: "Leo is talking about something that belongs to both himself and you — a shared 'we'. Standing alone, that possessive pronoun is ours."
  },
  {
    pronoun: "hers",
    icon: "💎",
    tagLabel: "ITEM 7 — EARRINGS",
    desc: "A pair of small gold hoop earrings is sitting on the bathroom sink.",
    clue: "One hoop has a tiny <b>star charm</b> attached.",
    suspects: [
      { name: "MARIA", line: "\"Those aren't mine, I only wear silver.\"", correct: false,
        reason: "Maria only wears silver jewelry — these are gold." },
      { name: "LENA", line: "\"Wait, those are my favorite hoops! See the star charm? I never take those off.\"", correct: true,
        reason: "Lena specifically recognizes the star charm as her own." },
      { name: "THE TWINS", line: "\"We don't wear earrings while DJing — too much static with the headphones.\"", correct: false,
        reason: "The twins don't wear earrings at all during parties." }
    ],
    line: "\"Those have to be ____ — that star charm is one of a kind.\"",
    speaker: "YOU (the host)",
    options: ["hers", "his", "yours"],
    explain: "The earrings belong to Lena — a woman who isn't part of this conversation. For a female third-party owner, standing alone, the correct form is hers."
  },
  {
    pronoun: "theirs",
    icon: "📿",
    tagLabel: "ITEM 8 — NECKLACE",
    desc: "A delicate necklace is found near the speakers, clasp still closed.",
    clue: "It's engraved with the letters <b>\"A + S forever.\"</b>",
    suspects: [
      { name: "MARIA", line: "\"Not familiar — none of my friends have those initials.\"", correct: false,
        reason: "Maria can't connect the initials to anyone she knows." },
      { name: "JAKE", line: "\"Wait, A and S... could be anyone, there's like three Alexes here tonight!\"", correct: false,
        reason: "Jake's guess is too vague — it doesn't actually confirm who owns it." },
      { name: "SOFIA", line: "\"A and S — that's Alex and Sam. It's their anniversary gift, I helped them pick it out.\"", correct: true,
        reason: "Sofia gives a specific, confirmed match: she personally helped choose this exact gift for this exact couple." }
    ],
    line: "\"That's got to be ____ — Alex and Sam picked that out together.\"",
    speaker: "YOU (the host)",
    options: ["theirs", "ours", "his"],
    explain: "The necklace belongs to Alex and Sam — a couple who aren't part of this conversation. For a third-party plural owner, standing alone, we use theirs."
  }
];

let current = 0;
let score = 0;
let phase = "detective"; // "detective" | "grammar"

const tracker = document.getElementById('tracker');
const card = document.getElementById('card');
const hint = document.getElementById('hint');

function renderTracker(){
  tracker.innerHTML = rounds.map((r,i)=>{
    let cls = 'tag';
    if(i < current) cls += ' done';
    else if(i === current) cls += ' current';
    const label = i < current ? r.pronoun.toUpperCase() : (i + 1);
    return `<div class="${cls}">${label}</div>`;
  }).join('');
}

function renderRound(){
  phase = "detective";
  renderDetectivePhase();
}

function renderDetectivePhase(){
  const r = rounds[current];
  hint.textContent = "Read the clue carefully, then pick the statement that actually matches it.";
  card.innerHTML = `
    <span class="item-tag">${r.tagLabel}</span>
    <span class="phase-tag">STEP 1 · INVESTIGATE</span>
    <span class="item-icon">${r.icon}</span>
    <div class="item-desc">${r.desc}</div>
    <div class="clue-box">🔎 <b>Clue:</b> ${r.clue}</div>
    <div class="suspects" id="suspects"></div>
    <div class="feedback" id="feedback" style="display:none;"></div>
  `;
  const suspectsEl = document.getElementById('suspects');
  r.suspects.forEach((s, idx)=>{
    const btn = document.createElement('button');
    btn.className = 'suspect-card';
    btn.innerHTML = `<span class="suspect-name">${s.name}</span><span class="suspect-line">${s.line}</span>`;
    btn.onclick = ()=>selectSuspect(idx, btn);
    suspectsEl.appendChild(btn);
  });
  renderTracker();
}

function selectSuspect(idx, btn){
  const r = rounds[current];
  const s = r.suspects[idx];
  const allBtns = document.querySelectorAll('.suspect-card');
  allBtns.forEach(b=>b.disabled = true);

  if(s.correct){
    btn.classList.add('right');
  } else {
    btn.classList.add('wrong');
    allBtns.forEach((b,i)=>{ if(r.suspects[i].correct) b.classList.add('right'); });
  }

  const feedback = document.getElementById('feedback');
  feedback.style.display = 'block';
  feedback.innerHTML = `
    <div class="stamp ${s.correct ? 'right' : 'wrong'}">${s.correct ? '🔎 CASE MATCHES!' : "🤔 DOESN'T ADD UP"}</div>
    <div class="explain">${s.reason}${s.correct ? '' : " The real match is highlighted above — that's the true owner."}</div>
    <button class="next-btn" id="toGrammarBtn">REPORT YOUR FINDING →</button>
  `;
  document.getElementById('toGrammarBtn').onclick = renderGrammarPhase;
}

function renderGrammarPhase(){
  phase = "grammar";
  const r = rounds[current];
  hint.textContent = "Now put it in words — choose the word that fits the blank.";
  card.innerHTML = `
    <span class="item-tag">${r.tagLabel}</span>
    <span class="phase-tag">STEP 2 · REPORT IT</span>
    <span class="item-icon">${r.icon}</span>
    <div class="dialogue">
      <span class="speaker">${r.speaker}</span>
      ${r.line.replace('____', '<span class="blank">____</span>')}
    </div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback" style="display:none;"></div>
  `;
  const optionsEl = document.getElementById('options');
  const shuffled = [...r.options].sort(()=>Math.random()-0.5);
  shuffled.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.textContent = opt;
    btn.onclick = ()=>selectAnswer(opt, btn);
    optionsEl.appendChild(btn);
  });
  renderTracker();
}

function selectAnswer(opt, btn){
  const r = rounds[current];
  const allBtns = document.querySelectorAll('.opt-btn');
  allBtns.forEach(b=>b.disabled = true);

  const correct = opt === r.pronoun;
  if(correct){
    btn.classList.add('right');
    score++;
  } else {
    btn.classList.add('wrong');
    allBtns.forEach(b=>{ if(b.textContent === r.pronoun) b.classList.add('right'); });
  }

  const feedback = document.getElementById('feedback');
  feedback.style.display = 'block';
  feedback.innerHTML = `
    <div class="stamp ${correct ? 'right' : 'wrong'}">${correct ? '🎉 CASE CLOSED' : '😅 NOT QUITE'}</div>
    <div class="explain">${r.explain}</div>
    <button class="next-btn" id="nextBtn">${current === rounds.length-1 ? 'FINISH CLEANING UP →' : 'NEXT ITEM →'}</button>
  `;
  document.getElementById('nextBtn').onclick = ()=>{
    current++;
    if(current >= rounds.length){
      renderFinal();
    } else {
      renderRound();
    }
  };
}

function renderFinal(){
  hint.textContent = "";
  const total = rounds.length;
  let rankLabel, rankNote;
  if(score === total){ rankLabel = "PARTY HOST LEGEND"; rankNote="Every clue cracked, every item returned. Flawless detective work!"; }
  else if(score >= total - 1){ rankLabel = "PRETTY GREAT HOST"; rankNote="Almost everything sorted — just double-check one report."; }
  else if(score >= total/2){ rankLabel = "STILL WAKING UP"; rankNote="Decent effort — a few reports need a second look."; }
  else { rankLabel = "NEEDS MORE COFFEE"; rankNote="Time to review those pronouns before the next party."; }

  card.innerHTML = `
    <div class="final">
      <span class="item-tag">LOST &amp; FOUND LOG</span>
      <span class="item-icon">🎉</span>
      <div class="item-desc">Cleanup complete! Here's the final log of who got what back:</div>
      <div class="report-line">The wallet is <b>his</b>.</div>
      <div class="report-line">The handbag is <b>hers</b>.</div>
      <div class="report-line">The phone charger is <b>mine</b>, says Zoe.</div>
      <div class="report-line">The scarf is <b>yours</b>.</div>
      <div class="report-line">The hairbrush is <b>theirs</b>.</div>
      <div class="report-line">The notebook is <b>ours</b>.</div>
      <div class="report-line">The earrings are <b>hers</b>.</div>
      <div class="report-line">The necklace is <b>theirs</b>.</div>
      <div class="rank">${rankLabel}</div>
      <div class="score-line">${rankNote} — ${score} / ${total} correct</div>
      <button class="restart-btn" id="restartBtn">CLEAN UP AGAIN</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = ()=>{
    current = 0; score = 0;
    renderRound();
  };
  renderTracker();
}

renderRound();
</script>
</body>
</html>
